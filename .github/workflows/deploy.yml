name: Deploy

# Deploys main to Azure once CI is green on it, or by hand (S-034, D-064). Never on a pull request: this
# repository is public, and a pull request's code must never reach the production environment's identity.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time, and a running one is never cancelled half-way (the migrate job, the paused queue).
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_DEV_COLLECT_TELEMETRY: no
  RESOURCE_GROUP: rg-sepiabox

jobs:
  # Decides whether to deploy before anything asks for approval: a run that would not deploy (another
  # branch, a failed or pull request CI run, a commit that is no longer the newest) ends here.
  check:
    # A green CI run of a push to main in this repository (not of a pull request, nor of a fork), or a
    # manual run of main: a manual run of another branch would use that branch's copy of this file.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.newest.outputs.deploy }}
    steps:
      # Two CI runs can finish out of order: only the newest commit on main is deployed, so an older one never
      # replaces it. The newer commit's own run deploys it.
      - name: Skip a commit that is no longer the newest on main
        id: newest
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          latest=$(git ls-remote "$REPOSITORY_URL" refs/heads/main | cut -f1)
          if [[ "$latest" == "$DEPLOY_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$DEPLOY_SHA is no longer the newest commit on main ($latest); not deploying it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # A deploy takes minutes; anything near an hour is stuck (the migrate wait alone ends after 15 minutes).
    timeout-minutes: 60
    # Its protection rule (manual approval) and the federated credential's subject both name it.
    environment: production
    steps:
      # The commit CI tested, not whatever main points at by now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Checked again after the approval, which can come long after the check job ran.
      - name: Skip a commit that is no longer the newest on main
        id: newest
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          latest=$(git ls-remote "$REPOSITORY_URL" refs/heads/main | cut -f1)
          if [[ "$latest" == "$DEPLOY_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$DEPLOY_SHA is no longer the newest commit on main ($latest); not deploying it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.newest.outputs.deploy == 'true'
        with:
          dotnet-version: 10.0.x

      # Pinned: how azd resolves the AppHost's parameters was read in this version (D-072).
      - uses: Azure/setup-azd@v2
        if: steps.newest.outputs.deploy == 'true'
        with:
          version: 1.36.0

      # OIDC: the Entra ID app has a federated credential for this repository's production environment.
      - uses: azure/login@v2
        if: steps.newest.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign azd in with the same federated credential
        if: steps.newest.outputs.deploy == 'true'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github
          az extension add --name containerapp --upgrade --yes --only-show-errors

      # A fresh runner has no .azure folder, so the azd environment is created here, with the values azd
      # generated on the first deploy: a new administrator login cannot be applied to the existing server
      # (D-061), so azd must never generate them here.
      - name: Create the azd environment from the saved parameters
        if: steps.newest.outputs.deploy == 'true'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          PG_USERNAME: ${{ secrets.PG_USERNAME }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_APP_PASSWORD: ${{ secrets.PG_APP_PASSWORD }}
          UPLOADER_PRINCIPAL_IDS: ${{ vars.UPLOADER_PRINCIPAL_IDS }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          CUSTOM_DOMAIN_BINDING: ${{ vars.CUSTOM_DOMAIN_BINDING }}
        run: |
          for name in PG_USERNAME PG_PASSWORD PG_APP_PASSWORD; do
            # jq prints "null" for a key it does not find, which could have been saved as the secret.
            if [[ -z "${!name}" || "${!name}" == "null" ]]; then
              echo "::error::Set the $name secret of the production environment (docs/operations.md)."
              exit 1
            fi
            # azd keeps generated secure parameters in a local vault and writes only a reference to
            # config.json; a runner has no such vault, and azd panics resolving it.
            if [[ "${!name}" == vault://* ]]; then
              echo "::error::The $name secret holds an azd vault reference, not the value: set it from Key Vault (docs/operations.md)."
              exit 1
            fi
          done
          # The domain goes into AllowedHosts, where a ";" or "*" would let any host in: a plain host name only.
          domain="${CUSTOM_DOMAIN,,}"
          domain_pattern='^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
          if [[ -n "$domain" && ! "$domain" =~ $domain_pattern ]]; then
            echo "::error::CUSTOM_DOMAIN must be empty or a host name such as app.sepiabox.com."
            exit 1
          fi
          case "${CUSTOM_DOMAIN_BINDING,,}" in
            "" | disabled) binding=Disabled ;;
            snienabled) binding=SniEnabled ;;
            *)
              echo "::error::CUSTOM_DOMAIN_BINDING must be Disabled or SniEnabled."
              exit 1
              ;;
          esac
          azd env new sepiabox --location francecentral --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt
          azd env config set infra.parameters.pg_username "$PG_USERNAME"
          azd env config set infra.parameters.pg_password "$PG_PASSWORD"
          azd env config set infra.parameters.pg_app_password "$PG_APP_PASSWORD"
          azd env config set infra.parameters.uploaderPrincipalIds "$UPLOADER_PRINCIPAL_IDS"
          # S-035: empty for no custom domain; the binding goes from Disabled to SniEnabled (docs/operations.md).
          azd env config set infra.parameters.customDomain "$domain"
          azd env config set infra.parameters.customDomainBinding "$binding"

      # The CLIP text model for the web's base image (S-056, D-071): downloaded only when models.json changes and
      # the registry lacks the image, and verified against its pinned SHA-256 whether it came from here or not.
      - name: Restore the downloaded models
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sepiabox/models
          key: web-models-${{ hashFiles('models/models.json') }}

      # Provision, run the migrate job and wait for it, then the import jobs and the web (S-032, S-033). A
      # failed migration ends the script, and so this job, before anything else is deployed.
      - name: Deploy
        if: steps.newest.outputs.deploy == 'true'
        run: scripts/deploy.sh

      # Keeps the last 5 images of every repository azd pushes (one per app or job), whatever azd names
      # them, so the registry's 10 GB never fill up (D-055). Only after a successful deploy.
      - name: Purge old images
        if: steps.newest.outputs.deploy == 'true'
        run: |
          registry=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].name" --output tsv)
          for repository in $(az acr repository list --name "$registry" --output tsv); do
            az acr run --registry "$registry" \
              --cmd "acr purge --filter '${repository}:.*' --ago 0d --keep 5 --untagged" /dev/null
          done
