name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older, now pointless run; runs on main always finish, since Deploy
# waits for them (D-082).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet format Sepiabox.slnx --verify-no-changes
      # Checks every workflow, and the scripts in their run steps with ShellCheck (S-034).
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Sepiabox.slnx --configuration Release --filter "Category!=Integration&Category!=LiveApi"

  # Tests that need Docker, FFmpeg or ML models. Linux only: Windows runners have no Linux Docker.
  integration:
    runs-on: ubuntu-latest
    # About 6 minutes since D-082; a hang fails the run instead of billing up to the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Only ffmpeg is installed, and it comes from Ubuntu: the runner's Microsoft sources (.list or .sources) are dropped first, because
      # packages.microsoft.com has answered 403 (no longer signed), which failed `apt-get update` before any test ran.
      # No recommended packages: they add about a hundred downloads, and a slow mirror once timed the job out on them.
      - run: |
          grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      # Models are never committed (D-016): download them once per models.json and verify their SHA-256.
      - id: models-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      - run: dotnet run --project src/Sepiabox.Ingest --configuration Release -- models download
      # Saved right after the download, so a failing test run still keeps the 350 MB for the next one.
      - if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      # The web image tests run in the web-image job below, only when their inputs change (D-082).
      - run: dotnet test Sepiabox.slnx --configuration Release --filter "Category=Integration&Category!=WebImage"
        env:
          # Model tests are skipped on machines without the models; in CI a missing model is a failure.
          SEPIABOX_REQUIRE_MODELS: "1"

  # The web's image as a deploy builds it (WebImageTests, S-056): the models image with the real CLIP text model and
  # two web releases on it. It runs on every push to main, so Deploy never ships an image it did not check, and on a
  # pull request only when it changes what goes into that image (D-082, issue #55); otherwise the job ends in seconds.
  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it merges into: its changes are their diff.
          fetch-depth: 2
      - id: changes
        name: Decide whether the web image is affected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The web and what it is built from, the models image and its script, the pinned models, the ingest that
          # downloads them (and the pipeline it builds with), the AppHost, the tests and their shared code, and this workflow.
          pattern='^(src/Sepiabox\.(Web|AppHost|Search|Catalog|ServiceDefaults|Ingest|Pipeline)/'
          pattern+='|infra/web-models/|scripts/web-models\.sh$|models/|tests/Sepiabox\.AppHost\.Tests/|tests/Shared/'
          pattern+='|Directory\.Build\.props$|\.gitattributes$|\.gitignore$|\.github/workflows/ci\.yml$)'
          # Fails safe: without the diff, the test runs.
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::Could not list this pull request's changes; running the web image tests."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif grep -E "$pattern" <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change reaches the web image; WebImageTests run on main after the merge."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The integration job's cache; on a miss only the three files the web carries are downloaded, and not saved,
      # so the cache under this key stays the complete folder.
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      - if: steps.changes.outputs.run == 'true'
        run: dotnet run --project src/Sepiabox.Ingest --configuration Release -- models download --only clip-vit-b32-text,clip-bpe-vocab,clip-vit-b32-vision
      - if: steps.changes.outputs.run == 'true'
        run: dotnet test tests/Sepiabox.AppHost.Tests --configuration Release --filter "Category=WebImage"
        env:
          SEPIABOX_REQUIRE_MODELS: "1"

  # The worker's image as a deploy builds it (S-036, D-107): FFmpeg and the verified models next to the worker. It runs
  # on every push to main and, on a pull request, only when it changes what goes into the image.
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        name: Decide whether the worker image is affected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(src/Sepiabox\.(Worker|Pipeline|Storage|Catalog|Search|Ingest|ServiceDefaults)/'
          pattern+='|infra/worker/|models/|\.dockerignore$|Directory\.Build\.props$|\.github/workflows/ci\.yml$)'
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::Could not list this pull request's changes; building the worker image."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif grep -E "$pattern" <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change reaches the worker image; it is built on main after the merge."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        name: Build the image (downloads and verifies the models)
        run: docker build --file infra/worker/Dockerfile --tag sepiabox-worker-test .
      - if: steps.changes.outputs.run == 'true'
        name: The image has FFmpeg, ffprobe, the verified models and the worker
        run: |
          docker run --rm --entrypoint ffmpeg sepiabox-worker-test -version | head -n 1
          docker run --rm --entrypoint ffprobe sepiabox-worker-test -version | head -n 1
          docker run --rm --entrypoint ls sepiabox-worker-test /models | tee models.txt
          grep -q clip-vit-b32-vision.onnx models.txt
          docker run --rm sepiabox-worker-test --help | grep -q -- "process --from-queue"
