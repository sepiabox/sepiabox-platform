name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet format Sepiabox.slnx --verify-no-changes
      # Checks every workflow, and the scripts in their run steps with ShellCheck (S-034).
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Sepiabox.slnx --configuration Release --filter "Category!=Integration&Category!=LiveApi"

  # Tests that need Docker, FFmpeg or ML models. Linux only: Windows runners have no Linux Docker.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Models are never committed (D-016): download them once per models.json and verify their SHA-256.
      - id: models-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      - run: dotnet run --project src/Sepiabox.Ingest --configuration Release -- models download
      # Saved right after the download, so a failing test run still keeps the 350 MB for the next one.
      - if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      - run: dotnet test Sepiabox.slnx --configuration Release --filter "Category=Integration"
        env:
          # Model tests are skipped on machines without the models; in CI a missing model is a failure.
          SEPIABOX_REQUIRE_MODELS: "1"
