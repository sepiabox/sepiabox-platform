name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older, now pointless run; runs on main always finish, since Deploy
# waits for them (D-090).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet format Sepiabox.slnx --verify-no-changes
      # Checks every workflow, and the scripts in their run steps with ShellCheck (S-034).
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Sepiabox.slnx --configuration Release --filter "Category!=Integration&Category!=LiveApi"

  # Tests that need Docker, FFmpeg or ML models. Linux only: Windows runners have no Linux Docker.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Models are never committed (D-016): download them once per models.json and verify their SHA-256.
      - id: models-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      - run: dotnet run --project src/Sepiabox.Ingest --configuration Release -- models download
      # Saved right after the download, so a failing test run still keeps the 350 MB for the next one.
      - if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      # The web image tests run in the web-image job below, only when their inputs change (D-090).
      - run: dotnet test Sepiabox.slnx --configuration Release --filter "Category=Integration&Category!=WebImage"
        env:
          # Model tests are skipped on machines without the models; in CI a missing model is a failure.
          SEPIABOX_REQUIRE_MODELS: "1"

  # The web's image as a deploy builds it (WebImageTests, S-056): the models image with the real CLIP text model and
  # two web releases on it. It runs on every push to main, so Deploy never ships an image it did not check, and on a
  # pull request only when it changes what goes into that image (D-090, issue #55); otherwise the job ends in seconds.
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it merges into: its changes are their diff.
          fetch-depth: 2
      - id: changes
        name: Decide whether the web image is affected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The web and what it is built from, the models image and its script, the pinned models, the model
          # download the script runs, the AppHost, the test itself and this workflow.
          pattern='^(src/Sepiabox\.(Web|AppHost|Search|Catalog|ServiceDefaults)/|src/Sepiabox\.Ingest/(Program\.cs|Models/)'
          pattern+='|infra/web-models/|scripts/web-models\.sh$|models/|tests/Sepiabox\.AppHost\.Tests/(WebImageTests\.cs|Sepiabox\.AppHost\.Tests\.csproj)$'
          pattern+='|Directory\.Build\.props$|\.gitattributes$|\.github/workflows/ci\.yml$)'
          if git diff --name-only HEAD^1 HEAD | grep -E "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change reaches the web image; WebImageTests run on main after the merge."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The integration job's cache; on a miss only the two files the web carries are downloaded, and not saved,
      # so the cache under this key stays the complete folder.
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      - if: steps.changes.outputs.run == 'true'
        run: dotnet run --project src/Sepiabox.Ingest --configuration Release -- models download --only clip-vit-b32-text,clip-bpe-vocab
      - if: steps.changes.outputs.run == 'true'
        run: dotnet test tests/Sepiabox.AppHost.Tests --configuration Release --filter "Category=WebImage"
        env:
          SEPIABOX_REQUIRE_MODELS: "1"
