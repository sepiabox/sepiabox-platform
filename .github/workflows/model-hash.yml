# Temporary (S-015): runs the integration job once on this branch, where the sandbox that wrote it cannot
# reach the model host or build infra/postgres. Removed before review.
name: S-015 integration check

on:
  push:
    branches: ['story/S-015-clip-embeddings']

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.sepiabox/models
          key: models-${{ hashFiles('models/models.json') }}
      - run: dotnet run --project src/Sepiabox.Ingest --configuration Release -- models download
      - run: dotnet test Sepiabox.slnx --configuration Release --filter "Category=Integration"
        env:
          SEPIABOX_REQUIRE_MODELS: "1"
      - run: dotnet test Sepiabox.slnx --configuration Release --filter "Category!=Integration"
